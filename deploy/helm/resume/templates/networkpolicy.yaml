{{- if .Values.networkPolicy.enabled }}
# Default deny, then allow exactly what the service needs:
#   - HTTP from pods in this namespace and any listed namespaces;
#   - metrics scraping from the monitoring namespace only;
#   - no egress at all: the service never makes an outbound call, not even DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "resume.fullname" . }}
  labels:
    {{- include "resume.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "resume.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector: {}
        {{- range .Values.networkPolicy.allowedNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
      ports:
        - port: http
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace | quote }}
      ports:
        - port: metrics
          protocol: TCP
  egress: []
{{- end }}
