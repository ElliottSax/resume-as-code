# Policy as code. CI runs these against the rendered Helm chart on every pull
# request, so an insecure manifest fails review before it reaches a cluster.
# Inside the cluster, Pod Security Admission ("restricted") enforces the same
# baseline at admission time: shift left, and keep the guard at the door too.
#
# Written as Kyverno ValidatingPolicy (CEL). Autogen rewrites each pod rule so
# it also checks Deployments, StatefulSets, DaemonSets, Jobs and CronJobs.
# Tested by `kyverno test policy/tests` against known-good and known-bad manifests.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-run-as-non-root
  annotations:
    policies.kyverno.io/description: Containers must not run as root, at the pod or container level.
spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs]
  variables:
    - name: containers
      expression: "object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : [])"
  validations:
    - expression: >-
        (has(object.spec.securityContext) && has(object.spec.securityContext.runAsNonRoot) && object.spec.securityContext.runAsNonRoot == true)
        || variables.containers.all(c, has(c.securityContext) && has(c.securityContext.runAsNonRoot) && c.securityContext.runAsNonRoot == true)
      message: Set securityContext.runAsNonRoot to true on the pod or on every container.
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-privilege-escalation
  annotations:
    policies.kyverno.io/description: No privileged containers and no setuid escalation.
spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs]
  variables:
    - name: containers
      expression: "object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : [])"
  validations:
    - expression: >-
        variables.containers.all(c, has(c.securityContext)
          && has(c.securityContext.allowPrivilegeEscalation) && c.securityContext.allowPrivilegeEscalation == false
          && (!has(c.securityContext.privileged) || c.securityContext.privileged == false))
      message: Every container must set allowPrivilegeEscalation to false and must not be privileged.
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-drop-all-capabilities
  annotations:
    policies.kyverno.io/description: Linux capabilities are opt-in, never inherited.
spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs]
  variables:
    - name: containers
      expression: "object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : [])"
  validations:
    - expression: >-
        variables.containers.all(c, has(c.securityContext) && has(c.securityContext.capabilities)
          && has(c.securityContext.capabilities.drop) && 'ALL' in c.securityContext.capabilities.drop)
      message: Every container must drop ALL capabilities.
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-read-only-root-filesystem
  annotations:
    policies.kyverno.io/description: An attacker who gets code execution cannot write to the image.
spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs]
  variables:
    - name: containers
      expression: "object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : [])"
  validations:
    - expression: >-
        variables.containers.all(c, has(c.securityContext)
          && has(c.securityContext.readOnlyRootFilesystem) && c.securityContext.readOnlyRootFilesystem == true)
      message: Every container must set readOnlyRootFilesystem to true.
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-requests-and-memory-limit
  annotations:
    policies.kyverno.io/description: The scheduler needs requests; the node needs a memory ceiling.
spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs]
  variables:
    - name: containers
      expression: "object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : [])"
  validations:
    - expression: >-
        variables.containers.all(c, has(c.resources) && has(c.resources.requests)
          && 'cpu' in c.resources.requests && 'memory' in c.resources.requests
          && has(c.resources.limits) && 'memory' in c.resources.limits)
      message: Every container needs CPU and memory requests and a memory limit.
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-pinned-images
  annotations:
    policies.kyverno.io/description: A tag like latest can point at different bytes tomorrow.
spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs]
  variables:
    - name: containers
      expression: "object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : [])"
  validations:
    - expression: >-
        variables.containers.all(c, c.image.contains('@sha256:')
          || (c.image.matches(':[A-Za-z0-9_.-]+$') && !c.image.endsWith(':latest')))
      message: Images must use an explicit tag other than latest, or better, a sha256 digest.
---
# Probes only make sense for long-running workloads, so this one targets
# Deployments directly (one-shot pods such as `helm test` hooks are exempt).
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-probes
  annotations:
    policies.kyverno.io/description: Kubernetes can only route around a broken pod it can detect.
spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments]
  validations:
    - expression: >-
        object.spec.template.spec.containers.all(c, has(c.readinessProbe) && has(c.livenessProbe))
      message: Every Deployment container needs a readinessProbe and a livenessProbe.
