# The delivery pipeline: every merge to main, and every Monday.
#
#   checks ─▶ build ─▶ drill ─▶ publish
#             scan     verify     receipts
#             push     signature  static site
#             sign     chaos      GitHub Pages
#             attest   SLO gate
#
# Each stage only sees what the previous one proved. The drill deploys the
# exact digest that was scanned and signed, and refuses anything else. The
# site is only republished if the drill met the SLO, so the receipts on the
# resume are always from a passing run.
#
# The weekly run rebuilds, rescans with a fresh vulnerability database and
# re-drills, so the receipts never go stale and new CVEs surface on their own.
name: delivery

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# One delivery at a time, never cancelled halfway. A newer push waits its
# turn, so the last thing deployed is always the newest commit. (Lesson from
# docs/postmortems/2026-11-09-stale-build-served-in-production.md.)
concurrency:
  group: delivery
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/elliottsax/resume-as-code

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build, scan, push, sign
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing: GitHub vouches for this workflow's identity
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        run: |
          BIN_DIR="$RUNNER_TEMP/bin" scripts/install-tools.sh trivy
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Build metadata
        id: meta
        run: |
          echo "version=$(git describe --tags --always 2>/dev/null || echo "${GITHUB_SHA::7}")" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build for scanning (nothing is pushed yet)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: resume:scan
          provenance: false
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: "Gate: no fixable HIGH or CRITICAL vulnerabilities"
        run: make scan IMAGE=resume:scan

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push for amd64 and arm64
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:main
          labels: org.opencontainers.image.revision=${{ github.sha }}
          # GitHub's attestations below replace BuildKit's own, so each fact
          # is recorded once, in the place `gh attestation verify` checks.
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.date }}
          cache-from: type=gha

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the image (keyless, no secrets involved)
        run: cosign sign --yes "$IMAGE@$DIGEST"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Generate the SBOM and vulnerability record
        run: |
          mkdir -p out
          trivy image --quiet --format spdx-json --output out/sbom.spdx.json "$IMAGE@$DIGEST"
          trivy image --quiet --scanners vuln --format json --output out/scan.json "$IMAGE@$DIGEST"
          # The arm64 variant ships too, so it gets the same gate.
          trivy image --quiet --platform linux/arm64 --scanners vuln --ignore-unfixed \
            --severity HIGH,CRITICAL --exit-code 1 "$IMAGE@$DIGEST"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
      - name: Attest the SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: out/sbom.spdx.json
          push-to-registry: true
      - name: Record image facts
        run: scripts/image-facts.sh "$IMAGE" "$DIGEST" > out/image.json
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-receipts
          path: |
            out/sbom.spdx.json
            out/scan.json
            out/image.json
          retention-days: 30

  drill:
    name: Chaos drill on the signed image
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      DIGEST: ${{ needs.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        run: |
          BIN_DIR="$RUNNER_TEMP/bin" scripts/install-tools.sh kind kubectl helm
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to deploy anything this workflow did not sign
        run: |
          cosign verify "$IMAGE@$DIGEST" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/delivery.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "signature verified for $IMAGE@$DIGEST"
      - name: Pull exactly the signed bytes
        run: |
          docker pull --quiet "$IMAGE@$DIGEST"
          docker tag "$IMAGE@$DIGEST" resume:drill
      - run: scripts/drill.sh
        env:
          IMAGE: resume:drill
      - name: Keep drill results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drill-receipts
          path: |
            out/drill.json
            out/drill-events.log
            out/k6-summary.json
          if-no-files-found: ignore
          retention-days: 30

  publish:
    name: Publish the resume with its receipts
    needs: [build, drill]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      # This run's artifacts: test-results, image-receipts and drill-receipts.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true
      - name: Assemble the receipts
        run: scripts/receipts.sh out > out/receipts.json && jq . out/receipts.json
      - name: Render the static site
        run: |
          cd app
          go run -ldflags "-X github.com/ElliottSax/resume-as-code/app/internal/buildinfo.Commit=${GITHUB_SHA}" . \
            export -out ../out/site -receipts ../out/receipts.json
          cp ../out/sbom.spdx.json ../out/site/
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out/site
          include-hidden-files: true
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
