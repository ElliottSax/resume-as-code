projects:
  - name: resume-as-code (this site)
    url: https://github.com/ElliottSax/resume-as-code
    summary: >-
      A production-grade platform whose only job is to serve this page, and to
      prove on every release that it survives failure.
    highlights:
      - Go service with Prometheus metrics, structured JSON logs, graceful shutdown and a distroless, non-root, read-only container
      - Every release builds a throwaway three-node Kubernetes cluster, deploys with Helm, then kills pods, drains a node and rolls out a deploy under load. The release is blocked unless the SLO holds.
      - "Supply chain controls: vulnerability scanning, an SBOM, keyless Sigstore signing and SLSA build provenance. Every CI action is pinned to a commit SHA and every tool download is checksum-verified."
      - SLO burn-rate alerts with unit tests, a runbook linked from every alert, and Kyverno policies that reject insecure manifests before merge
      - Terraform for the repository's own settings and for a Google Cloud Run production target that deploys with OIDC, with no stored keys
    stack: [Go, Docker, Kubernetes, Helm, GitHub Actions, Terraform, Prometheus, Grafana, Kyverno, Trivy, Sigstore]
  - name: Home lab automation platform
    summary: >-
      I run my own always-on automation systems on a desktop and three Linux
      laptops, including a self-hosted LLM API gateway. Operating them is where
      I learned the lessons in my postmortems.
    highlights:
      - A host suspend killed the gateway and its watchdog at the same moment, causing a 7 h 45 min outage. I added a supervisor for the supervisor.
      - Found a two-day silent outage in which 87% of jobs failed in under a second because one code path never sent an auth header, then fixed it and wrote up why nothing alerted
      - Added per-machine circuit breakers, single-instance locks and atomic writes to a multi-machine job dispatcher after seeing it fail in each of those ways
    stack: [Python, Linux, SSH, tmux, LiteLLM, Windows Task Scheduler]

