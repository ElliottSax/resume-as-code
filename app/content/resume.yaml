name: Elliott Saxton
headline: Senior Operations Analyst moving into DevOps & Site Reliability Engineering
location: Minneapolis, MN
summary: >-
  Fifteen years in operations where a missed window costs money: aircraft turns
  for Delta, distribution centers at SuperValu and Best Buy, and payment and
  gift-card operations at Target. DevOps is the same job done in code, so I
  built this site to show it. It has service-level objectives where I used to
  have SLAs, runbooks where I used to have SOPs, blameless postmortems where I
  used to write root-cause memos, and a pipeline that proves its own claims on
  every release.

